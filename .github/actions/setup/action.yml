name: Setup
description: Loads dependencies

runs:
  using: composite
  steps:
    - name: Run Rokit
      uses: CompeyDev/setup-rokit@v0.2.1

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
      shell: bash
